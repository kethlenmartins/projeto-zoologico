<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Libertadores – Mata-Mata</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1d13;
      color: white;
      text-align: center;
    }

    h1, h2 {
      margin-top: 20px;
    }

    .round {
      margin: 30px 0;
    }

    .matches {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
    }

    .match {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #13291d;
      padding: 15px;
      border-radius: 10px;
    }

    .card {
      width: 160px;
      height: 55px;
      background: #111;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      user-select: none;
    }

    .winner {
      background: #2ecc71;
      color: #000;
      cursor: default;
    }

    .loser {
      background: #e74c3c;
      color: #000;
      cursor: default;
    }

    .final {
      margin-top: 40px;
      display: none;
    }

    .final img {
      max-width: 300px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h1>🏆 Libertadores – Mata-Mata</h1>

<div id="game"></div>

<div class="final" id="final">
  <h1>🎉 PARABÉNS, CAMPEÃO DA LIBERTADORES! 🎉</h1>
  <h2>Feliz aniversário! 🥳⚽</h2>
  <img src="campeao.png" alt="Campeão segurando a taça">
</div>
<script>
  const CRB = "CRB";

  const allTeams = [
    CRB, "Flamengo", "River Plate", "Boca Juniors",
    "Palmeiras", "Atlético-MG", "Nacional",
    "Peñarol", "Grêmio", "São Paulo",
    "Independiente", "Colo-Colo",
    "Olimpia", "Racing", "Estudiantes", "Libertad"
  ];

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  let currentRound = shuffle([...allTeams]);
  let roundIndex = 0;
  const rounds = ["Oitavas de Final", "Quartas de Final", "Semifinal", "Final"];

  const gameDiv = document.getElementById("game");
  let nextWinners = [];

  function renderRound() {
    gameDiv.innerHTML = "";

    const roundDiv = document.createElement("div");
    roundDiv.className = "round";

    const title = document.createElement("h2");
    title.innerText = rounds[roundIndex];
    roundDiv.appendChild(title);

    const matchesDiv = document.createElement("div");
    matchesDiv.className = "matches";

    for (let i = 0; i < currentRound.length; i += 2) {
      const teamA = currentRound[i];
      const teamB = currentRound[i + 1];

      const matchDiv = document.createElement("div");
      matchDiv.className = "match";

      const cardA = document.createElement("div");
      const cardB = document.createElement("div");

      cardA.className = "card";
      cardB.className = "card";

      cardA.innerText = "???";
      cardB.innerText = "???";

      function finish(winnerCard, loserCard, winner, loser) {
        winnerCard.innerText = winner;
        loserCard.innerText = loser;

        winnerCard.classList.add("winner");
        loserCard.classList.add("loser");

        cardA.onclick = null;
        cardB.onclick = null;

        nextWinners.push(winner);

        if (nextWinners.length === currentRound.length / 2) {
          setTimeout(nextRound, 900);
        }
      }

      cardA.onclick = () => {
        if (cardA.classList.contains("winner")) return;

        if (teamA === CRB || teamB === CRB) {
          // CRB vence, mas fica NA POSIÇÃO CLICADA
          finish(
            cardA,
            cardB,
            CRB,
            teamA === CRB ? teamB : teamA
          );
        } else {
          finish(cardA, cardB, teamA, teamB);
        }
      };

      cardB.onclick = () => {
        if (cardB.classList.contains("winner")) return;

        if (teamA === CRB || teamB === CRB) {
          // CRB vence, mas fica NA POSIÇÃO CLICADA
          finish(
            cardB,
            cardA,
            CRB,
            teamA === CRB ? teamB : teamA
          );
        } else {
          finish(cardB, cardA, teamB, teamA);
        }
      };

      matchDiv.appendChild(cardA);
      matchDiv.appendChild(cardB);
      matchesDiv.appendChild(matchDiv);
    }

    roundDiv.appendChild(matchesDiv);
    gameDiv.appendChild(roundDiv);
  }

  function nextRound() {
    currentRound = nextWinners;
    nextWinners = [];
    roundIndex++;

    if (currentRound.length === 1) {
      gameDiv.innerHTML = "";
      document.getElementById("final").style.display = "block";
    } else {
      renderRound();
    }
  }

  renderRound();
</script>


</body>
</html>
