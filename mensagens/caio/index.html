<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversário Leo - Caio</title>
</head>
<body>
  <a id="easter-egg" href="especial.html" style="position: fixed; display: none; z-index: 9999; background: gold; padding: 12px 20px; border: 3px solid orange; text-decoration: none; color: black; font-weight: bold; font-size: 1.2em; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">🎁 Clique aqui!</a>
  <img src="images/birthday.gif" alt="GIF de aniversário">
  
  <h1>Feliz Aniversário, Leo.</h1>
  
  <p>Feliz aniversário, Leo! A sua amizade é algo muito importante para mim e desejo que você tenha um ano maravilhoso repleto de conquistas e saúde!!!</p>
  
  <p>De: Caio</p>
  
  <a href="../../index.html">Voltar para todas as mensagens</a>

  <script>
    const easterEgg = document.getElementById('easter-egg');
    
    function showEasterEgg() {
      // Força o display para calcular o tamanho real do botão
      easterEgg.style.display = 'block';
      easterEgg.style.visibility = 'hidden';
      
      // Obtém o tamanho real do botão
      const buttonWidth = easterEgg.offsetWidth;
      const buttonHeight = easterEgg.offsetHeight;
      
      // Restaura visibilidade
      easterEgg.style.visibility = 'visible';
      
      // Usa a área visível da viewport (importante para mobile com scroll)
      const viewportWidth = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
      const viewportHeight = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
      
      // Margem maior para garantir que não fique cortado
      const margin = 20;
      const maxX = viewportWidth - buttonWidth - margin;
      const maxY = viewportHeight - buttonHeight - margin;
      
      // Garante que os valores sejam sempre positivos e dentro da tela
      const x = Math.max(margin, Math.min(maxX, Math.random() * maxX));
      const y = Math.max(margin, Math.min(maxY, Math.random() * maxY));
      
      easterEgg.style.left = x + 'px';
      easterEgg.style.top = y + 'px';
      easterEgg.style.display = 'block';
      
      // Esconde depois de 1 segundo
      setTimeout(() => {
        easterEgg.style.display = 'none';
      }, 1000);
    }
    
    // Mostra a cada 3 segundos
    setInterval(showEasterEgg, 3000);
  </script>
</body>
</html>
